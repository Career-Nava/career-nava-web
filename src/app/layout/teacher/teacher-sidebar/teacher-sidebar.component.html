<div class="sidebar teacher-sidebar" [class.open]="isOpen">
  <a href="/home" class="d-block p-4">
    <img src="assets/images/logo/logo-variant.png" class="w-100 object-fit-contain" alt="Logo">
  </a>
  <div class="sidebar-menu">
    <ul class="menu">
      <li class="menu-item d-block d-sm-none">
        <button (click)="onToggleSidebar()" class="btn btn-primary">Menu</button>
      </li>

      <li class="menu-item">
        <span class="subtitle">Mentor Dashboard</span>
        <a routerLink="/teacher/overview" routerLinkActive="active" class="nav-link">
          <fa-icon [icon]="faHouse"></fa-icon>
          <span>Home</span>
        </a>
      </li>

      <li class="menu-item">
        <a routerLink="/teacher/scholars" routerLinkActive="active" class="nav-link">
          <fa-icon [icon]="faFile"></fa-icon>
          <span>My Scholars</span>
        </a>
      </li>

          <li class="menu-item">
            <a (click)="logout()" routerLinkActive="active" class="nav-link">
            <fa-icon [icon]="faArrowRightFromBracket"></fa-icon>
            <span>Logout</span>
            </a>
          </li>

    </ul>
  </div>
</div>
