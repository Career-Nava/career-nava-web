<header *ngIf="user$ | async as user" class="auth-topbar bg-white shadow-sm">
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid justify-content-between justify-content-lg-end">
      <a class="navbar-brand d-lg-none" [routerLink]="homeRoute">
        <img src="assets/images/logo/logo-variant.png" alt="Career Nava Logo" class="logo-sm" id="logoFull">
        <img src="assets/images/logo/favicon-black.png" alt="Career Nava Logo" class="logo-sm" id="logoFavicon">
      </a>

      <div class="d-flex auth-topbar__menus align-items-center gap-3 flex-wrap">
        <div class="nav-item dropdown position-relative auth-topbar__account">
          <button
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            aria-label="Open user menu"
            class="auth-topbar__user-trigger nav-link dropdown-toggle d-flex align-items-center gap-3 p-2 rounded">
            <div
              *ngIf="showsCalendlyStatus(user.role)"
              class="calendly-status-badge"
              [ngClass]="user.calendlyConnected ? 'calendly-status-badge--connected' : 'calendly-status-badge--disconnected'"
              [attr.title]="getCalendlyStatusLabel(user)"
              [attr.aria-label]="getCalendlyStatusLabel(user)">
              <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                <path *ngIf="user.calendlyConnected"
                      fill-rule="evenodd"
                      d="M8.603 3.799A4.49 4.49 0 0 1 12 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 0 1 3.498 1.307 4.491 4.491 0 0 1 1.307 3.497A4.49 4.49 0 0 1 21.75 12a4.49 4.49 0 0 1-1.549 3.397 4.491 4.491 0 0 1-1.307 3.497 4.491 4.491 0 0 1-3.497 1.307A4.49 4.49 0 0 1 12 21.75a4.49 4.49 0 0 1-3.397-1.549 4.49 4.49 0 0 1-3.498-1.306 4.491 4.491 0 0 1-1.307-3.498A4.49 4.49 0 0 1 2.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 0 1 1.307-3.497 4.49 4.49 0 0 1 3.497-1.307Zm7.007 6.387a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                      clip-rule="evenodd"/>
                <path *ngIf="!user.calendlyConnected"
                      fill-rule="evenodd"
                      d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z"
                      clip-rule="evenodd"/>
              </svg>
              <span class="visually-hidden">{{ getCalendlyStatusLabel(user) }}</span>
            </div>

            <div class="avatar-wrapper bg-gradient-purple text-white rounded-circle d-flex align-items-center justify-content-center">
              <img *ngIf="user.profilePicture" [src]="user.profilePicture" [alt]="user.fullName" class="avatar-img">
              <span *ngIf="!user.profilePicture"><b>{{ user.fullName.charAt(0) }}</b></span>
            </div>

            <div class="user-info">
              <h5 class="mb-0">{{ user.fullName }}</h5>
              <p class="mb-0 text-muted small">{{ user.email }}</p>
            </div>
          </button>

          <ul class="dropdown-menu dropdown-menu-end auth-user-menu p-0 border-0">
            <li class="auth-user-menu__header" id="user-info-mobile">
              <div>
                <h5 class="mb-1">{{ user.fullName }}</h5>
                <p class="mb-0">{{ user.email }}</p>
              </div>
            </li>

            <li>
              <button
                type="button"
                class="dropdown-item auth-user-menu__item"
                (click)="openProfile(user.role)">
                <fa-icon [icon]="faUser"></fa-icon>
                <span>Profile</span>
              </button>
            </li>

            <li><hr class="dropdown-divider auth-user-menu__divider"></li>

            <li>
              <button
                type="button"
                (click)="logout()"
                class="dropdown-item auth-user-menu__item auth-user-menu__item--danger">
                <fa-icon [icon]="faArrowRightFromBracket"></fa-icon>
                <span>Logout</span>
              </button>
            </li>

            <li *ngIf="showsCalendlyStatus(user.role)" class="auth-user-menu__status">
              <span class="admin-badge" [ngClass]="user.calendlyConnected ? 'admin-badge--success' : 'admin-badge--warning'">
                {{ getCalendlyStatusLabel(user) }}
              </span>
            </li>
          </ul>
        </div>

        <button
          type="button"
          (click)="toggleSidebar()"
          class="auth-topbar__menu-toggle d-lg-none"
          aria-label="Open sidebar">
          <fa-icon [icon]="faBars" class="auth-topbar__menu-icon"></fa-icon>
        </button>
      </div>
    </div>
  </nav>
</header>
