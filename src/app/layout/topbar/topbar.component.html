<header *ngIf="user$ | async as user" class="topbar bg-white shadow-sm">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid justify-content-between justify-content-lg-end">

      <a class="navbar-brand d-lg-none" href="#">
        <img src="assets/images/logo/logo-variant.png" alt="Career Nava Logo" class="logo-sm">
      </a>

      <div class="d-flex topbar-menus align-items-center gap-3">

        <div class="nav-item dropdown position-relative">
          <a href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
             class="nav-link dropdown-toggle d-flex align-items-center gap-3 p-2 rounded hover-shadow">

            <!-- Calendly Badge -->
            <div *ngIf="user.role === 'mentor'" class="check-badge"
                 [ngClass]="user.calendlyConnected ? 'text-success' : 'text-danger'">
              <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                <path *ngIf="user.calendlyConnected"
                      fill-rule="evenodd"
                      d="M8.603 3.799A4.49 4.49 0 0 1 12 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 0 1 3.498 1.307 4.491 4.491 0 0 1 1.307 3.497A4.49 4.49 0 0 1 21.75 12a4.49 4.49 0 0 1-1.549 3.397 4.491 4.491 0 0 1-1.307 3.497 4.491 4.491 0 0 1-3.497 1.307A4.49 4.49 0 0 1 12 21.75a4.49 4.49 0 0 1-3.397-1.549 4.49 4.49 0 0 1-3.498-1.306 4.491 4.491 0 0 1-1.307-3.498A4.49 4.49 0 0 1 2.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 0 1 1.307-3.497 4.49 4.49 0 0 1 3.497-1.307Zm7.007 6.387a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                      clip-rule="evenodd"/>
                <path *ngIf="!user.calendlyConnected"
                      fill-rule="evenodd"
                      d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z"
                      clip-rule="evenodd"/>
              </svg>
            </div>

            <!-- Avatar -->
            <div class="avatar-wrapper bg-gradient-purple text-white rounded-circle d-flex align-items-center justify-content-center">
              <img *ngIf="user.profilePicture" [src]="user.profilePicture" [alt]="user.fullName" class="avatar-img">
              <span *ngIf="!user.profilePicture"><b>{{ user.fullName?.charAt(0) }}</b></span>
            </div>

            <!-- User Info -->
            <div class="user-info">
              <h5 class="mb-0">{{ user.fullName }}</h5>
              <p class="mb-0 text-muted small">{{ user.email }}</p>
            </div>
          </a>

          <!-- Dropdown Menu -->
          <ul class="dropdown-menu p-3 shadow-lg border-0 rounded">
            <!-- Calendly Status -->
            <li class="dropdown-item p-3 d-flex align-items-center gap-2">
              <span class="status-indicator" [ngClass]="user.calendlyConnected ? 'verified' : 'not-verified'"></span>
              <div>
                <p class="mb-1 fw-semibold">
                  Calendly Status:
                  <span [ngClass]="user.calendlyConnected ? 'text-success' : 'text-danger'">
                    {{ user.calendlyConnected ? 'Verified' : 'Not-Verified' }}
                  </span>
                </p>
              </div>
            </li>

            <!-- Link Button (if not verified) -->
            <li *ngIf="!user.calendlyConnected && user.role === 'mentor'" class="dropdown-item p-3">
              <button class="btn btn-gradient-purple w-100 fw-semibold" (click)="connectCalendly(user.userId)">
                Link My Calendly
              </button>
            </li>
          </ul>
        </div>

        <!-- Sidebar toggle for mobile -->
        <button (click)="toggleSidebar()" class="btn btn-primary d-block d-lg-none">Menu</button>
      </div>
    </div>
  </nav>
</header>
