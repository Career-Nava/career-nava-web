<div class="sidebar mentor-sidebar" [class.open]="isOpen">
  <a routerLink="/home" class="d-block p-4">
    <img src="assets/images/logo/logo-variant.png" class="w-100 object-fit-contain" alt="Career Nava Logo">
  </a>

  <div class="sidebar-menu">
    <ul class="menu">
      <li class="menu-item d-block d-sm-none">
        <button type="button" (click)="onToggleSidebar()" class="btn btn-secondary">Close Menu</button>
      </li>

      <li class="menu-item">
        <span class="subtitle">Mentor Dashboard</span>
        <a routerLink="/mentor/overview" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
          <fa-icon [icon]="faHouse"></fa-icon>
          <span>Overview</span>
        </a>
      </li>

      <li class="menu-item">
        <a routerLink="/mentor/profile" routerLinkActive="active" class="nav-link">
          <fa-icon [icon]="faUser"></fa-icon>
          <span>My Profile</span>
        </a>
      </li>

      <li class="menu-item">
        <a routerLink="/mentor/sessions" routerLinkActive="active" class="nav-link">
          <fa-icon [icon]="faFile"></fa-icon>
          <span>My Sessions</span>
        </a>
      </li>

      <li class="menu-item">
        <button type="button" (click)="logout()" class="nav-link border-0 bg-transparent text-start">
          <fa-icon [icon]="faArrowRightFromBracket"></fa-icon>
          <span>Logout</span>
        </button>
      </li>
    </ul>
  </div>
</div>
