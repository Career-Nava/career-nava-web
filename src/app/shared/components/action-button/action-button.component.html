<a
  *ngIf="routerLink; else externalOrButton"
  [routerLink]="routerLink"
  class="dashboard-action-button"
  [ngClass]="[
    extraClass,
    'dashboard-action-button--' + variant,
    isIconOnly ? 'dashboard-action-button--icon' : 'dashboard-action-button--pill',
    loading ? 'dashboard-action-button--loading' : ''
  ]"
  [attr.title]="effectiveTitle"
  [attr.aria-label]="ariaLabel"
  [attr.aria-disabled]="disabled || loading ? 'true' : null"
  [attr.tabindex]="disabled || loading ? -1 : null"
  (click)="handlePress($event)">
  <span class="dashboard-action-button__content">
    <span *ngIf="loading" class="spinner-border spinner-border-sm dashboard-action-button__spinner" aria-hidden="true"></span>
    <fa-icon *ngIf="!loading && icon" [icon]="icon"></fa-icon>
    <span *ngIf="!isIconOnly && label" class="dashboard-action-button__label">{{ label }}</span>
  </span>
</a>

<ng-template #externalOrButton>
  <a
    *ngIf="href; else nativeButton"
    [attr.href]="disabled || loading ? null : href"
    [attr.target]="target"
    [attr.rel]="computedRel"
    class="dashboard-action-button"
    [ngClass]="[
      extraClass,
      'dashboard-action-button--' + variant,
      isIconOnly ? 'dashboard-action-button--icon' : 'dashboard-action-button--pill',
      loading ? 'dashboard-action-button--loading' : ''
    ]"
    [attr.title]="effectiveTitle"
    [attr.aria-label]="ariaLabel"
    [attr.aria-disabled]="disabled || loading ? 'true' : null"
    [attr.tabindex]="disabled || loading ? -1 : null"
    (click)="handlePress($event)">
    <span class="dashboard-action-button__content">
      <span *ngIf="loading" class="spinner-border spinner-border-sm dashboard-action-button__spinner" aria-hidden="true"></span>
      <fa-icon *ngIf="!loading && icon" [icon]="icon"></fa-icon>
      <span *ngIf="!isIconOnly && label" class="dashboard-action-button__label">{{ label }}</span>
    </span>
  </a>

  <ng-template #nativeButton>
    <button
      [attr.type]="buttonType"
      class="dashboard-action-button"
      [ngClass]="[
        extraClass,
        'dashboard-action-button--' + variant,
        isIconOnly ? 'dashboard-action-button--icon' : 'dashboard-action-button--pill',
        loading ? 'dashboard-action-button--loading' : ''
      ]"
      [attr.title]="effectiveTitle"
      [attr.aria-label]="ariaLabel"
      [disabled]="disabled || loading"
      (click)="handlePress($event)">
      <span class="dashboard-action-button__content">
        <span *ngIf="loading" class="spinner-border spinner-border-sm dashboard-action-button__spinner" aria-hidden="true"></span>
        <fa-icon *ngIf="!loading && icon" [icon]="icon"></fa-icon>
        <span *ngIf="!isIconOnly && label" class="dashboard-action-button__label">{{ label }}</span>
      </span>
    </button>
  </ng-template>
</ng-template>
