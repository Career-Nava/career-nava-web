<header class="header w-100 py-2" [class.scrolled]="isScrolled">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <!-- Logo -->
      <a [routerLink]="['/home']" class="navbar-brand max-w-240">
        <img src="assets/images/logo/logo.png" class="w-100 object-fit-contain" alt="Logo"/>
      </a>

      <!-- Mobile Toggler -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a [routerLink]="['/home']" routerLinkActive="active" aria-current="page" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a [routerLink]="['/about']" routerLinkActive="active" class="nav-link">About Us</a>
          </li>
          <li class="nav-item">
            <a [routerLink]="['/blog']" routerLinkActive="active" class="nav-link">Blog</a>
          </li>
        </ul>

        <!-- Auth Actions -->
        <div class="nav-action d-flex gap-2 ms-auto">
          <!-- Show Sign In when NOT authenticated -->
          @if (!isAuthenticated()) {
            <a [routerLink]="['/sign-in']" class="btn hero-btn sign-in">
              <span>Sign In</span>
            </a>
          }

          <!-- Show Book Session when authenticated -->
          @if (isAuthenticated()) {
            <a [routerLink]="['mentee/mentors']" class="btn hero-btn book">
              <span>Book a Session</span>
            </a>
          }
        </div>
      </div>
    </div>
  </nav>
</header>
