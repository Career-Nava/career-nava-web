<section class="founders-section position-relative overflow-hidden">

  <!-- Background Gradient Orbs -->
  <div class="orb orb-left"></div>
  <div class="orb orb-right"></div>

  <div class="container position-relative z-2">

    <!-- Header -->
    <div class="founders-header text-center mb-6">
      <h2 class="section-title">Meet Our Founders</h2>
      <div class="section-title-underline mx-auto"></div>
      <p class="section-subtitle">
        The visionaries shaping CareerNava’s mission to unlock scholarship access for all.
      </p>
    </div>

    <!-- Carousel -->
    <div id="foundersCarousel"
         #foundersCarousel
         class="carousel carousel-fade slide"
         data-bs-ride="carousel">

      <div class="carousel-inner">

        <div class="carousel-item"
             *ngFor="let founder of founders; let i = index"
             [class.active]="i === 0">

          <div class="founder-card mx-auto">

            <div class="row g-4 align-items-center justify-content-center">

              <!-- Founder Image -->
              <div class="col-12 col-md-5 text-center">
                <div class="founder-image-frame">
                  <img [src]="founder.image" class="founder-photo" alt="{{ founder.name }}">
                </div>
              </div>

              <!-- Founder Details -->
              <div class="col-12 col-md-7 text-center text-md-start">
                <h3 class="founder-name">{{ founder.name }}</h3>
                <p class="founder-message">“{{ founder.message }}”</p>
              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- Carousel Controls -->
      <button class="carousel-control-prev founders-nav" type="button" data-bs-target="#foundersCarousel" data-bs-slide="prev">
        <span class="nav-icon">&larr;</span>
      </button>

      <button class="carousel-control-next founders-nav" type="button" data-bs-target="#foundersCarousel" data-bs-slide="next">
        <span class="nav-icon">&rarr;</span>
      </button>

    </div>

  </div>
</section>
