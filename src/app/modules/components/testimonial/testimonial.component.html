<section class="testimonial position-relative text-center overflow-hidden bg-no-repeat bg-cover"
         [style.background-image]="'url(/assets/images/illustrations/africa-map.png)'">

  <!-- Decorative ellipses -->
  <div class="ellipsis first"></div>
  <div class="ellipsis second"></div>

  <!-- Add overlay here -->
  <div class="overlay-layer-blur"></div>

  <div class="container position-relative z-5 py-5">
    <!-- Section Header -->
    <div class="mb-5 px-3 px-md-0">
      <h2 class="display-5 fw-bold">The Impact We Have Provided To Our Users</h2>
      <p class="lead">
        Career Nava brings the best high school teachers home and empowers students to excel in exams and beyond.
      </p>
    </div>

    <!-- Carousel -->
    <div class="w-100 mx-auto max-w-md" *ngIf="testimonials?.length">
      <div id="testimonialCarousel" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicators -->
        <div class="carousel-indicators">
          <button *ngFor="let t of testimonials; let i = index"
                  type="button"
                  data-bs-target="#testimonialCarousel"
                  [attr.data-bs-slide-to]="i"
                  [class.active]="i === 0"
                  [attr.aria-current]="i === 0 ? 'true' : null"
                  [attr.aria-label]="'Slide ' + (i + 1)">
          </button>
        </div>

        <!-- Carousel Items -->
        <div class="carousel-inner">
          <div *ngFor="let t of testimonials; let i = index" class="carousel-item" [class.active]="i === 0">
            <div class="row align-items-center justify-content-center g-4">

              <!-- Text -->
              <div class="col-12 col-lg-6 d-flex flex-column justify-content-center">
                <div class="carousel-caption text-dark fw-bold text-center text-lg-start">
                  <h3 class="fw-bold mb-3">{{ t.name }}</h3>
                  <p class="mb-0">"{{ t.message }}"</p>
                </div>
              </div>

              <!-- Image -->
              <div class="col-12 col-lg-6">
                <img [src]="t.image" alt="{{ t.name }}" class="img-fluid rounded shadow-sm users-img"/>
              </div>

            </div>
          </div>
        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#testimonialCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#testimonialCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>

      </div>
    </div>
  </div>
</section>
