<div class="vh-100 linear-brand-primary overflow-hidden">
    <div class="row h-100">
        <div class="col-12 col-lg-6">
            <div class="container d-flex flex-column align-items-center justify-content-center h-100">
        <div class="text-center" style="margin-bottom: 2em;">
            <img src="assets/images/logo/logo.png" class="w-100 object-fit-contain mx-auto" alt="Logo" style="max-width: 200px;">
        </div>
        <div class="card w-100 max-w-4xl mx-auto border-0 bg-transparent text-white">
            <div class="card-header bg-transparent justify-content-center border-0">
                <!-- <img src="assets/images/logo/logo.png" class="w-100 object-fit-contain mx-auto" alt="Logo" style="max-width: 200px;"> -->
                <h2 class="card-title fs-10">Sign In With CareerNava</h2>
            </div>
            <div class="card-body">
                <div style="margin-bottom: 2em;">
                    <button class="btn btn-white w-100 gap-2">
                        <img src="assets/images/logo/google.png" class="object-fit-contain" alt="Logo" style="width: 24px; height: 24px;">
                        Sign In With Google
                    </button>
                </div>
                <div class="d-flex align-items-center gap-2" style="margin: 2em 0;">
                    <hr>
                    <span class="w-100 text-center">Or Sign In With</span>
                    <hr>
                </div>
                <form [formGroup]="signInForm" (ngSubmit)="onSubmit()"
                class="d-flex flex-column gap-2">
                    <div class="input-group flex-column gap-1">
                        <label for="email">Email Address</label>
                    <input class="form-control p-3" type="email" id="email" formControlName="email"  class="w-100">
                    <!-- <div *ngIf="email.invalid && (email.dirty || email.touched)">
                        <div *ngIf="email.errors['required']">
                        Email is required.
                        </div>
                        <div *ngIf="email.errors['email']">
                        Please enter a valid email.
                        </div>
                    </div> -->
                    </div>
                    <div class="input-group flex-column gap-1">
                        <label for="password">Password</label>
                        <input class="form-control" type="password" id="password" formControlName="password" placeholder="Enter your password" class="w-100">
                        <!-- <div *ngIf="password.invalid && (password.dirty || password.touched)">
                        <div *ngIf="password.errors?.['required']">
                            Password is required.
                        </div>
                        </div> -->
                    </div>
                    <!-- Submit button -->
                <button class="btn btn-secondary mt-4" type="submit" [disabled]="signInForm.invalid">Sign In</button>
                </form>
            </div>
        </div>
    </div>
        </div>

        <div class="col-12 col-lg-6 d-none d-lg-block">
            <div class="d-flex flex-column align-items-center justify-content-center h-100">
                <div id="signinCarouselAutoplaying" class="carousel slide" data-bs-ride="carousel">
                    <div id="content-quote" class="position-absolute bottom-0 left-0 right-0 w-100 text-white">
                        <h2 class="text-default-brand-secondary">Welcome Back To CareerNava</h2>
                        <p>“CareerNava guided me step by step — from scholarships to mentorship — and gave me the confidence to achieve my goals.”</p>  
                    </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                <img src="assets/images/landing-page/1.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
                <div class="carousel-item">
                <img src="assets/images/landing-page/2.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
                <div class="carousel-item">
                <img src="assets/images/landing-page/3.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
                <div class="carousel-item">
                <img src="assets/images/landing-page/4.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
            </div>
            </div>
            </div>
        </div>
    </div>
    
</div>
