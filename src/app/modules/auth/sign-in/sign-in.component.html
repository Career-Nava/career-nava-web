<!-- sign-in.component.html -->
<div class="container d-flex flex-column align-items-center justify-content-center h-100">
  <div class="text-center" style="margin-bottom: 2em;">
    <a [routerLink]="['/home']">
      <img
        src="assets/images/logo/logo.png"
        class="w-100 object-fit-contain mx-auto"
        alt="Logo"
        style="max-width: 200px;">
    </a>
  </div>

  <div class="card w-100 max-w-4xl mx-auto border-0 bg-transparent text-white">
    <div class="card-header bg-transparent justify-content-center border-0">
      <h2 class="card-title fs-10">Sign In With CareerNava</h2>
    </div>

    <div class="card-body">
      <div style="margin-bottom: 2em;">
        <button type="button" class="btn btn-white w-100 gap-2" (click)="onGoogleSignIn()"
                [disabled]="!isGoogleSignInAvailable" title="Google sign-in is temporarily unavailable">
          <img src="assets/images/logo/google.png" class="object-fit-contain" alt="Logo" style="width: 24px; height: 24px;">
          Sign In With Google
        </button>

        <div class="d-flex align-items-center gap-2" style="margin: 2em 0;">
          <hr>
          <span class="w-100 text-center">Or Sign In With</span>
          <hr>
        </div>

        <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-2">
          <div class="input-group flex-column gap-1">
            <label for="email">Email Address</label>
            <input class="form-control p-3 w-100"
                   type="email"
                   id="email"
                   formControlName="email"
                   placeholder="Enter your email">
            <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger small mt-1">
              <div *ngIf="email.errors?.['required']">Email is required.</div>
              <div *ngIf="email.errors?.['email']">Please enter a valid email.</div>
            </div>
          </div>

          <div class="input-group flex-column gap-1">
            <label for="password">Password</label>
            <input class="form-control w-100"
                   type="password"
                   id="password"
                   formControlName="password"
                   placeholder="Enter your password">
            <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger small mt-1">
              <div *ngIf="password.errors?.['required']">Password is required.</div>
              <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</div>
            </div>
          </div>

          <button class="btn btn-secondary mt-4" type="submit" [disabled]="signInForm.invalid || loading">
            <span *ngIf="!loading">Sign In</span>
            <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>

        <p class="my-4 text-center">Don't have an account yet?
          <a routerLink="/sign-up" class="text-default-brand-secondary">Sign Up Here</a>
        </p>
      </div>
    </div>
  </div>
</div>
