<div id="authLayout" class="linear-brand-primary overflow-hidden" style="min-height: 100vh;">
    <div class="row h-100" style="min-height: 100vh;">
        <div class="col-12 col-lg-6">
            <router-outlet></router-outlet> 
        </div> 

        <div class="col-12 col-lg-6 d-none d-lg-block bg-default-brand-secondary" style="position: relative;">
            <div class="auth-content d-flex flex-column align-items-center justify-content-center h-100">
                <div id="content-quote" class="w-100 text-white" style="z-index: 4; padding: 1em;">
                        <h1 class="text-default-brand-primary" style="font-size: 48px;">Welcome Back To <br> CareerNava</h1>
                        <p style="font-size: 18px; line-height: 1.8;">“CareerNava guided me step by step — from scholarships to mentorship — and gave me the confidence to achieve my goals.”</p>  
                    </div>
            </div>

            <div id="meetMentorsAuth">
                <div class="w-100 mentor-carousel">
                    <div class="mentor-track">
                        <!-- Mentors -->
                        <div id="mentor" *ngFor="let mentor of mentors" class="card">
                                <img
                            [src]="mentor.image"
                            [alt]="mentor.name"
                            class="w-100 h-100 mx-auto"
                            />
                        </div>
                    </div>
                    <div class="mentor-track-2">
                        <!-- Mentors -->
                        <div id="mentor" *ngFor="let mentor of mentors" class="card">
                                <img
                            [src]="mentor.image"
                            [alt]="mentor.name"
                            class="w-100 h-100 mx-auto"
                            />
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-column align-items-center justify-content-center h-100 d-none">
                <div id="signinCarouselAutoplaying" class="carousel slide" data-bs-ride="carousel">
                    <div id="content-quote" class="position-absolute bottom-0 left-0 right-0 w-100 text-white">
                        <h2 class="text-default-brand-secondary">Welcome Back To CareerNava</h2>
                        <p>“CareerNava guided me step by step — from scholarships to mentorship — and gave me the confidence to achieve my goals.”</p>  
                    </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                <img src="assets/images/landing-page/1.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
                <div class="carousel-item">
                <img src="assets/images/landing-page/2.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
                <div class="carousel-item">
                <img src="assets/images/landing-page/3.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
                <div class="carousel-item">
                <img src="assets/images/landing-page/4.jpg" alt="Image" class="d-block object-fit-contain w-100 h-100">
                </div>
            </div>
            </div>
            </div>

        </div>
    </div>
    
</div>
