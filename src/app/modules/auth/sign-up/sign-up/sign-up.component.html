<div class="container d-flex flex-column align-items-center justify-content-center h-100" style="padding-top: 2em;">
        <div class="text-center" style="margin-bottom: 2em;">
            <img src="assets/images/logo/logo.png" class="w-100 object-fit-contain mx-auto" alt="Logo" style="max-width: 200px;">
        </div>
        <div class="card w-100 max-w-4xl mx-auto border-0 bg-transparent text-white">
            <div class="card-header bg-transparent justify-content-center border-0">
                <!-- <img src="assets/images/logo/logo.png" class="w-100 object-fit-contain mx-auto" alt="Logo" style="max-width: 200px;"> -->
                <h2 class="card-title fs-10">Sign Up With CareerNava</h2>
        </div>
            <div class="card-body">

                <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-2">
                    
                    <div class="d-flex flex-column flex-lg-row gap-2">
                        <div class="input-group flex-column gap-1">
                            <label for="email">First Name</label> 
                            <input formControlName="firstName" type="text" placeholder="First Name">
                        </div>
                        <div class="input-group flex-column gap-1">
                            <label for="email">Last Name</label>
                            <input formControlName="lastName" type="text" placeholder="Last Name">
                        </div>
                    </div>
                    
                    <div class="input-group flex-column gap-1">
                        <label for="email">Email Address</label>
                        <input formControlName="email" type="email" placeholder="Email">
                    </div>
                    <div class="input-group flex-column gap-1">
                        <label for="email">You're Signing As?</label>
                        <select formControlName="role">
                            <option value="mentee">Mentee</option>
                            <option value="mentor">Mentor</option>
                        </select>
                    </div>
                    <hr>
                    <div class="input-group flex-column gap-1">
                        <label for="email">New Password</label>
                        <input formControlName="password" type="password" placeholder="Password">
                    </div>
                    <div class="input-group flex-column gap-1">
                        <label for="email">Confirm Password</label>
                        <input formControlName="confirmPassword" type="password" placeholder="Confirm Password">
                    </div>
                    
                    <button class="btn btn-secondary mt-4" type="submit">Sign Up</button>
                </form>

                <p class="my-4 text-center">Have an account? <a href="/sign-in" class="text-default-brand-secondary">Sign In Here</a></p>
            </div>
        </div>
    </div>
