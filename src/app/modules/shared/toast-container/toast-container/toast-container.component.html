<div
  aria-live="polite"
  aria-atomic="true"
  class="position-fixed top-0 end-0 p-3"
  style="z-index: 1200;"
>
  <ngb-toast
    *ngFor="let toast of toastService.toasts"
    [class]="toast.classname"
    [autohide]="true"
    [delay]="toast.delay || 500"
    (hidden)="toastService.remove(toast)"
    role="alert"
  >
    <!-- If toast is a TemplateRef -->
    <ng-container *ngIf="isTemplate(toast); else textToast">
      <ng-container *ngTemplateOutlet="asTemplateRef(toast.textOrTpl)"></ng-container>
    </ng-container>

    <!-- If toast is a string -->
    <ng-template #textToast>
      {{ toast.textOrTpl }}
    </ng-template>
  </ngb-toast>
</div>
