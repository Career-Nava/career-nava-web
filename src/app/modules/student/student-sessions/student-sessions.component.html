<app-session-group-panel
  pageEyebrow="Session planning"
  pageTitle="Your career guidance sessions"
  pageDescription="Track upcoming mentorship conversations, payment-ready bookings, and completed guidance sessions in one place."
  [heroSummary]="heroSummary"
  panelTitle="Session timeline"
  panelDescription="Use each group to review what is happening today, what is booked next, and what you have already completed."
  context="mentee"
  [groups]="sessionGroups"
  [loading]="loading"
  [errorMessage]="error"
  [actionLabel]="getSessionActionLabel"
  [actionDisabled]="isSessionActionDisabled"
  (sessionAction)="handleSessionClick($event)">
</app-session-group-panel>

<div class="payment-modal-backdrop" *ngIf="showPaymentModal">
  <div class="payment-modal" role="dialog" aria-modal="true" aria-label="Session payment">
    <button type="button" class="payment-close-btn" aria-label="Close payment dialog" (click)="closePaymentModal()">&times;</button>

    <div *ngIf="isLoadingPayment" class="payment-loading">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted small">Preparing payment window...</p>
    </div>

    <div class="payment-iframe-container" *ngIf="!isLoadingPayment">
      <iframe
        class="payment-iframe"
        [src]="safePaymentUrl"
        allow="clipboard-write; payment; camera; microphone; fullscreen"
        sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals">
      </iframe>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show" *ngIf="showJoinConfirmModal"></div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showJoinConfirmModal" role="dialog" aria-modal="true" aria-label="Join session confirmation">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content join-modal">
      <div class="modal-header join-modal__header">
        <h5 class="modal-title d-flex gap-2">
          <fa-icon [icon]="faWarning" class="text-warning"></fa-icon>
          Payment Required
        </h5>
        <button type="button" class="btn-close" (click)="closeJoinConfirmModal()"></button>
      </div>

      <div class="modal-body px-4 join-modal__body">
        <p class="fw-semibold mb-2">
          This session has not been paid for yet.
        </p>
        <p class="text-muted mb-0">
          You can join now, or complete payment before joining.
        </p>
      </div>

      <div class="modal-footer justify-content-between px-4 join-modal__footer">
        <button class="btn btn-secondary flex-fill" (click)="payBeforeJoining()">
          Pay & Join
        </button>

        <button class="btn btn-outline-secondary flex-fill" (click)="joinWithoutPayment()">
          Join Session
        </button>
      </div>
    </div>
  </div>
</div>
