<app-session-group-panel
  pageEyebrow="Mentor schedule"
  pageTitle="Your mentorship schedule"
  pageDescription="Manage upcoming conversations with mentees and keep track of completed mentorship sessions."
  [heroSummary]="heroSummary"
  panelTitle="Booked sessions"
  panelDescription="Review what is happening today, what is coming up next, and which conversations have already been completed."
  context="mentor"
  [groups]="sessionGroups"
  [loading]="loading"
  [errorMessage]="error"
  [actionLabel]="getSessionActionLabel"
  [actionDisabled]="isSessionActionDisabled"
  (sessionAction)="openMeeting($event)">
</app-session-group-panel>
