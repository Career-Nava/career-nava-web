<app-session-group-panel
  pageTitle="My Sessions"
  pageDescription="Sessions booked with you will appear here. This view uses your signed-in mentor account and does not require a mentor ID in the URL."
  panelTitle="My Sessions"
  panelDescription="Overview of sessions booked with you by mentees."
  context="mentor"
  [groups]="sessionGroups"
  [loading]="loading"
  [errorMessage]="error"
  [actionLabel]="getSessionActionLabel"
  [actionDisabled]="isSessionActionDisabled"
  (sessionAction)="openMeeting($event)">
</app-session-group-panel>
